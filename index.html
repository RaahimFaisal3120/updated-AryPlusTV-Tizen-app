<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="referrer" content="no-referrer">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARY Plus TV</title>
    <!-- Load Tizen webapis if available on Samsung TV -->
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js" onerror="console.log('webapis fallback')"></script>
    <style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

:root {
    --accent: #6bfe12;
    --bg: #0a0c10;
    --panel: #141821;
    --muted: #9aa3b2;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
}

/* Everything is drawn on a 1920x1080 stage that is scaled to fit any screen size */
#stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--bg);
    transform-origin: 0 0;
}
/* While playing, every layer above the TV's video plane must be see-through */
html.playing, body.playing, body.playing #stage { background: transparent !important; }
#av-player { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
body.avplay #html5-player { display: none; }
body.playing #app, body.playing #detail { display: none !important; }

/* ===================== HOME ===================== */
#app {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    animation: fadeIn 0.5s ease;
}

/* Big backdrop of whatever is focused */
.hero-layer {
    position: absolute;
    right: 0;
    top: 0;
    width: 1440px;
    height: 810px;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.6s var(--ease-soft);
}
.hero-layer.show { opacity: 1; }
.hero-shade {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    background:
        linear-gradient(90deg, var(--bg) 0%, var(--bg) 22%, rgba(10,12,16,0.85) 38%, rgba(10,12,16,0.15) 65%, rgba(10,12,16,0) 100%),
        linear-gradient(0deg, var(--bg) 0%, var(--bg) 30%, rgba(10,12,16,0.6) 45%, rgba(10,12,16,0) 70%);
    pointer-events: none;
}

#topbar {
    position: absolute;
    left: 90px;
    right: 90px;
    top: 40px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 4;
}
#topbar .brand-logo { height: 52px; max-width: 220px; object-fit: contain; }
.topbar-right { display: flex; align-items: center; }
.key-hint { font-size: 19px; color: #c3c9d4; font-weight: 600; letter-spacing: 0.3px; }
.key-hint b {
    display: inline-block;
    min-width: 34px;
    padding: 2px 9px;
    margin: 0 6px 0 14px;
    border-radius: 7px;
    background: rgba(255,255,255,0.16);
    color: #ffffff;
    font-size: 16px;
    text-align: center;
}
#clock { font-size: 26px; font-weight: 700; color: #ffffff; }

#hero-info {
    position: absolute;
    left: 90px;
    top: 150px;
    width: 860px;
    height: 400px;
    z-index: 3;
}
#hero-info.swap { animation: heroIn 0.6s var(--ease-out); }
@keyframes heroIn { from { opacity: 0; transform: translateX(-26px); } }
.kicker {
    display: inline-block;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
}
.kicker.new { background: var(--accent); color: #000; padding: 5px 14px; border-radius: 6px; letter-spacing: 2px; }
.hero-logo { display: none; max-width: 560px; max-height: 170px; object-fit: contain; object-position: left bottom; margin-bottom: 14px; }
.has-logo .hero-logo { display: block; animation: logoIn 0.45s var(--ease-soft) both; }
@keyframes logoIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#hero-info .hero-title, #detail-info .hero-title { display: none; }
.hero-title {
    font-size: 72px;
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: -0.5px;
    margin-bottom: 18px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.6);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.hero-meta { font-size: 24px; color: #e4e7ee; font-weight: 600; margin-bottom: 14px; }
.hero-meta .dot { color: var(--accent); margin: 0 12px; }
.hero-meta .rating { border: 2px solid rgba(255,255,255,0.5); border-radius: 6px; padding: 0 8px; font-size: 19px; }
.hero-desc {
    font-size: 23px;
    line-height: 1.45;
    color: #c9ced8;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.hero-progress { display: none; align-items: center; margin-top: 20px; font-size: 21px; color: #e4e7ee; font-weight: 600; }
.hero-progress.on { display: flex; }
.hero-progress .track { width: 300px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.25); overflow: hidden; }
.hero-progress .track i { display: block; height: 100%; background: var(--accent); }

/* Rows of cards */
#rows-viewport {
    position: absolute;
    left: 0;
    top: 568px;
    width: 1920px;
    height: 512px;
    overflow: hidden;
    z-index: 3;
}
#rows { transition: transform 0.5s var(--ease-out); }
.row { padding-bottom: 18px; transition: opacity 0.4s var(--ease-soft); opacity: 0.55; }
.row.active-row { opacity: 1; }
.row-title {
    font-size: 30px;
    font-weight: 800;
    padding: 0 90px;
    height: 46px;
    display: flex;
    align-items: center;
}
.row-title .row-count { font-size: 20px; color: var(--muted); font-weight: 600; }
.row-title .row-tag {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1.5px;
    background: var(--accent);
    color: #000;
    padding: 3px 10px;
    border-radius: 5px;
}
.row-viewport { padding: 22px 90px 26px; overflow: visible; }
.row-track {
    display: flex;
    transition: transform 0.45s var(--ease-out);
}

.card {
    position: relative;
    flex-shrink: 0;
    border-radius: 12px;
    background: var(--panel);
    cursor: pointer;
    transition: transform 0.45s var(--ease-out);
    backface-visibility: hidden;
}
.card .thumb::after {
    content: '';
    position: absolute;
    left: 0; top: 0; right: 0; bottom: 0;
    border-radius: 12px;
    border: 5px solid var(--accent);
    opacity: 0;
    transition: opacity 0.3s var(--ease-soft);
    z-index: 3;
    pointer-events: none;
}
.card.focused .thumb::after { opacity: 1; }
.card .cap .c1 { transition: color 0.3s var(--ease-soft); }
.card .thumb { position: relative; overflow: hidden; border-radius: 12px; background: #1a1f2a; }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.5s ease; }
.card .thumb img.loaded { opacity: 1; }
.card.focused {
    transform: scale(1.09);
    z-index: 5;
}
.card.bump { animation: bump 0.32s ease; }
@keyframes bump { 50% { transform: scale(1.09) translateX(14px); } }

.card.poster { width: 232px; }
.card.poster .thumb { width: 232px; height: 331px; }
.card.ep { width: 400px; background: transparent; }
.card.ep .thumb { width: 400px; height: 225px; }
.card .cap { padding: 12px 4px 0; }
.card .cap .c1 { font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .cap .c2 { font-size: 18px; color: var(--muted); font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.focused .cap .c1 { color: var(--accent); }

.badge {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(0,0,0,0.78);
    color: #ffffff;
    z-index: 2;
}
.badge.new, .badge.live { background: var(--accent); color: #000000; }
.badge.live::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #e50914; margin-right: 7px; vertical-align: 1px; }
.pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: rgba(255,255,255,0.28); z-index: 2; }
.pbar i { display: block; height: 100%; background: var(--accent); }
.play-ico {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 74px;
    height: 74px;
    margin: -37px 0 0 -37px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    border: 3px solid #ffffff;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.3s, transform 0.35s var(--ease-out);
    z-index: 2;
}
.play-ico::after {
    content: '';
    position: absolute;
    left: 27px;
    top: 20px;
    border-left: 25px solid #ffffff;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
}
.card.focused .play-ico { opacity: 1; transform: none; }
.card.skeleton .thumb { background: linear-gradient(90deg, #161a23 0%, #222836 50%, #161a23 100%); }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.row-empty { font-size: 22px; color: var(--muted); padding: 30px 0; }

/* ===================== SERIES PAGE ===================== */
#detail {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    z-index: 20;
    display: none;
    overflow: hidden;
}
#detail.open { display: block; animation: viewIn 0.5s var(--ease-out); }
#detail.closing { display: block; animation: viewOut 0.28s var(--ease-soft) forwards; }
#detail-bg { position: absolute; right: 0; top: 0; width: 1440px; height: 810px; object-fit: cover; opacity: 0; transition: opacity 0.8s ease; }
#detail-bg.loaded { opacity: 1; }
#detail-info { position: absolute; left: 90px; top: 70px; width: 980px; animation: heroIn 0.6s var(--ease-out) 0.08s backwards; }
#detail-info .hero-title { font-size: 66px; }
#detail-actions { position: absolute; left: 90px; top: 452px; display: flex; }
.btn {
    display: flex;
    align-items: center;
    height: 72px;
    padding: 0 34px;
    border-radius: 14px;
    background: rgba(255,255,255,0.14);
    border: 3px solid transparent;
    font-size: 25px;
    font-weight: 800;
    color: #ffffff;
    cursor: pointer;
    transition: transform 0.3s var(--ease-out), background-color 0.25s var(--ease-soft), color 0.25s var(--ease-soft);
}
.btn .bsub { font-size: 19px; font-weight: 600; opacity: 0.8; }
.btn svg { width: 28px; height: 28px; fill: currentColor; }
.btn.primary { background: rgba(255,255,255,0.92); color: #000000; }
.btn.focused { background: var(--accent); color: #000000; transform: scale(1.07); }
#detail-ranges { position: absolute; left: 90px; top: 552px; display: flex; }
.chip {
    padding: 9px 22px;
    border-radius: 30px;
    font-size: 21px;
    font-weight: 700;
    color: #c9ced8;
    background: rgba(255,255,255,0.08);
    border: 3px solid transparent;
    cursor: pointer;
    transition: transform 0.3s var(--ease-out), background-color 0.25s var(--ease-soft), color 0.25s var(--ease-soft);
}
.chip.current { color: #ffffff; background: rgba(255,255,255,0.2); }
.chip.focused { background: var(--accent); color: #000000; transform: scale(1.08); }
#detail-row { position: absolute; left: 0; top: 608px; width: 1920px; }
#detail-epdesc {
    position: absolute;
    left: 90px;
    top: 958px;
    width: 1300px;
    font-size: 22px;
    line-height: 1.4;
    color: #c9ced8;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.watching-tag {
    position: absolute;
    right: 10px;
    top: 10px;
    z-index: 2;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 4px 9px;
    border-radius: 6px;
    background: #ffffff;
    color: #000000;
}
.detail-hint { position: absolute; right: 90px; top: 46px; }
#detail.area-actions #detail-row .row-track, #detail.area-ranges #detail-row .row-track { opacity: 0.6; }
#detail-row .row-track { transition: transform 0.5s var(--ease-out), opacity 0.3s; }

/* ===================== PLAYER ===================== */
#player-container {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    z-index: 100;
    display: none;
    overflow: hidden;
}
#html5-player { width: 100%; height: 100%; object-fit: contain; background: #000000; }
#player-hud {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s var(--ease-soft);
}
#player-hud.visible { opacity: 1; pointer-events: auto; }
.hud-shade-top { position: absolute; left: 0; right: 0; top: 0; height: 300px; background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0)); }
.hud-shade-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 460px; background: linear-gradient(0deg, rgba(0,0,0,0.92), rgba(0,0,0,0)); }
.hud-top { position: absolute; left: 90px; top: 60px; right: 90px; transition: transform 0.45s var(--ease-out); }
#player-hud:not(.visible) .hud-top { transform: translateY(-30px); }
#hud-kicker { font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
#hud-title { font-size: 52px; font-weight: 900; margin-top: 6px; }
#hud-sub { font-size: 24px; color: #d0d4dc; margin-top: 6px; max-width: 1300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hud-status { font-size: 20px; color: var(--accent); font-weight: 700; margin-top: 8px; min-height: 26px; }
.hud-bottom { position: absolute; left: 90px; right: 90px; bottom: 56px; transition: transform 0.45s var(--ease-out), opacity 0.3s; }
#player-hud:not(.visible) .hud-bottom { transform: translateY(40px); }
#player-container.strip-on .hud-bottom { opacity: 0; transform: translateY(40px); }

#hud-timeline { display: flex; align-items: center; height: 70px; }
#hud-cur, #hud-remain { font-size: 26px; font-weight: 700; min-width: 128px; font-variant-numeric: tabular-nums; }
#hud-remain { text-align: right; color: #d0d4dc; }
#hud-bar { position: relative; flex: 1; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.28); transition: height 0.2s; }
#hud-bar.focused { height: 14px; }
#hud-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px; background: var(--accent); }
#hud-scrub-fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: rgba(255,255,255,0.65); border-radius: 5px; display: none; }
#hud-thumb {
    position: absolute;
    top: 50%;
    left: 0;
    width: 26px;
    height: 26px;
    margin: -13px 0 0 -13px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 0 0 rgba(107,254,18,0.6);
    transform: scale(0.7);
    transition: transform 0.25s var(--ease-out);
}
#hud-bar.focused #hud-thumb { transform: scale(1.15); box-shadow: 0 0 0 7px rgba(107,254,18,0.55); }
#hud-bubble {
    position: absolute;
    bottom: 34px;
    left: 0;
    transform: translateX(-50%);
    padding: 8px 18px;
    border-radius: 10px;
    background: #ffffff;
    color: #000000;
    font-size: 28px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s;
}
#hud-bubble small { font-size: 18px; font-weight: 700; color: #444; margin-left: 8px; }
#player-container.scrubbing #hud-bubble { opacity: 1; }
#player-container.scrubbing #hud-scrub-fill { display: block; }

/* Playback controls in the center of the screen; extras (episodes, quality) bottom-right */
#hud-row { display: flex; align-items: center; margin-top: 22px; height: 84px; }
#hud-row #hud-extras { margin-left: auto; }
.pbtn.disabled { opacity: 0.3; }
#hud-main {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 160px;
    margin-top: -80px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.4s var(--ease-out), opacity 0.3s;
}
#player-hud:not(.visible) #hud-main { transform: scale(0.94); }
#player-container.strip-on #hud-main { opacity: 0; }
#hud-main .pbtn { width: 94px; height: 94px; background: rgba(0,0,0,0.45); }
#hud-main .pbtn svg { width: 46px; height: 46px; }
#hud-main .pbtn.big { width: 128px; height: 128px; }
#hud-main .pbtn.big svg { width: 64px; height: 64px; }
#hud-main .pbtn.focused { background: var(--accent); }
#player-hud.visible ~ #skip-intro { bottom: 280px; }
#player-hud.visible ~ #upnext { bottom: 280px; }
#hud-extras { display: flex; align-items: center; }
.pbtn.pill { width: auto; height: 74px; padding: 0 26px 0 20px; border-radius: 34px; }
.pbtn.pill svg { width: 40px; height: 40px; }
.pbtn .lbl { font-size: 26px; font-weight: 800; color: #ffffff; }
.pbtn.focused .lbl { color: #000000; }
.pbtn {
    position: relative;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.12);
    border: 3px solid transparent;
    cursor: pointer;
    transition: transform 0.3s var(--ease-out), background-color 0.25s var(--ease-soft);
}
.pbtn svg { width: 46px; height: 46px; fill: #ffffff; transition: fill 0.25s; }
.pbtn.big { width: 112px; height: 112px; }
.pbtn.big svg { width: 58px; height: 58px; }
.pbtn.focused { background: var(--accent); transform: scale(1.12); }
.pbtn.focused svg { fill: #000000; }
.pbtn .tip {
    position: absolute;
    top: 100%;
    left: 50%;
    margin-top: 12px;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    opacity: 0;
    transition: opacity 0.2s;
}
.pbtn.focused .tip { opacity: 1; }
#hud-badges { display: none; font-size: 20px; font-weight: 700; color: #c9ced8; }
.live-pill { display: none; font-size: 22px; font-weight: 900; letter-spacing: 2px; color: #ffffff; }
.live-pill::before { content: ''; display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #e50914; margin-right: 10px; animation: pulse 1.4s ease infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
#player-container.live #hud-timeline { display: none; }
#player-container.live .live-pill { display: inline-block; }

#hud-center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 150px;
    height: 150px;
    margin: -75px 0 0 -75px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
}
#hud-center svg { width: 70px; height: 70px; fill: #ffffff; }
#hud-center.flash { animation: centerFlash 0.7s var(--ease-out); }
@keyframes centerFlash { 0% { opacity: 1; transform: scale(0.8); } 100% { opacity: 0; transform: scale(1.35); } }

.side-pill {
    position: absolute;
    right: 90px;
    bottom: 250px;
    display: flex;
    align-items: center;
    padding: 18px 34px;
    border-radius: 14px;
    background: rgba(255,255,255,0.95);
    color: #000000;
    font-size: 26px;
    font-weight: 900;
    opacity: 0;
    transform: translateX(40px);
    pointer-events: none;
    transition: opacity 0.35s, transform 0.45s var(--ease-out);
}
.side-pill b { font-size: 17px; background: #000; color: #fff; border-radius: 6px; padding: 2px 8px; }
.side-pill.visible { opacity: 1; transform: none; }

#upnext {
    position: absolute;
    right: 90px;
    bottom: 90px;
    width: 640px;
    padding: 26px;
    border-radius: 20px;
    background: rgba(14,17,23,0.95);
    border: 1px solid rgba(255,255,255,0.14);
    opacity: 0;
    transform: translateY(40px);
    pointer-events: none;
    transition: opacity 0.35s, transform 0.5s var(--ease-out);
}
#upnext.visible { opacity: 1; transform: none; }
.un-top { display: flex; align-items: center; }
#upnext-img { width: 240px; height: 135px; border-radius: 10px; object-fit: cover; background: #1a1f2a; }
.un-k { font-size: 18px; font-weight: 800; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
#upnext-title { font-size: 30px; font-weight: 900; margin-top: 6px; }
#upnext-sub { font-size: 20px; color: var(--muted); margin-top: 4px; }
.un-btns { display: flex; margin-top: 22px; }
.un-btns .btn { height: 62px; font-size: 23px; flex: 1; justify-content: center; }
.un-btns .btn.focused { transform: scale(1.04); }

#ep-strip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 450px;
    padding-top: 40px;

/* Settings panel (quality + speed) */
#settings-panel {
    position: absolute;
    right: 90px;
    bottom: 230px;
    width: 780px;
    padding: 30px 34px 22px;
    background: rgba(14, 17, 23, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 22px;
    z-index: 5;
    opacity: 0;
    transform: translateY(26px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.3s var(--ease-soft), transform 0.45s var(--ease-out);
}
#settings-panel.visible { opacity: 1; transform: none; pointer-events: auto; }
.settings-title { font-size: 28px; font-weight: 800; margin-bottom: 18px; }
.settings-cols { display: flex; }
.settings-col { flex: 1; min-width: 0; }
.settings-head { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #8c93a3; margin-bottom: 10px; }
.settings-item {
    display: flex;
    align-items: center;
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: 14px;
    border: 2px solid transparent;
    font-size: 24px;
    font-weight: 600;
    color: #d5d9e2;
    background: rgba(255, 255, 255, 0.06);
    cursor: pointer;
    transition: background-color 0.22s var(--ease-soft), color 0.22s var(--ease-soft), border-color 0.22s var(--ease-soft), transform 0.3s var(--ease-out);
}
.settings-item .set-check { width: 36px; color: var(--accent); font-weight: 800; }
.settings-item.active { color: var(--accent); }
.settings-item.focused { background: var(--accent); color: #000000; transform: scale(1.03); }
.settings-item.focused .set-check { color: #000000; }
.settings-note { font-size: 17px; color: #8c93a3; padding: 6px 4px; }
.settings-hint { margin-top: 14px; font-size: 15px; color: #8c93a3; text-align: center; }

/* Spinner + toast */
#spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 76px;
    height: 76px;
    margin: -38px 0 0 -38px;
    border: 6px solid rgba(255, 255, 255, 0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    display: none;
    z-index: 300;
}
@keyframes spin { to { transform: rotate(360deg); } }
#toast {
    position: absolute;
    left: 50%;
    bottom: 70px;
    transform: translate(-50%, 30px);
    padding: 18px 36px;
    border-radius: 40px;
    background: rgba(255,255,255,0.96);
    color: #000000;
    font-size: 26px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    z-index: 400;
    transition: opacity 0.3s, transform 0.4s var(--ease-out);
}
#toast.visible { opacity: 1; transform: translate(-50%, 0); }

@keyframes fadeIn { from { opacity: 0; } }
@keyframes viewIn { from { opacity: 0; transform: scale(1.03); } }
@keyframes viewOut { to { opacity: 0; transform: scale(1.02); } }
#app.behind { animation: none; }

#boot-screen {

    left: 0;

    align-items: center;
    justify-content: center;

.boot-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1100px;
    height: 1100px;
    margin: -550px 0 0 -550px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(107, 254, 18, 0.55) 0%, rgba(107, 254, 18, 0.12) 38%, rgba(0, 0, 0, 0) 68%);

    animation: bootGlow 3s ease-out 0.45s forwards;
}
.boot-flare {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1500px;
    height: 4px;
    margin: -2px 0 0 -750px;
    background: linear-gradient(90deg, rgba(107,254,18,0) 0%, #6bfe12 30%, #ffffff 50%, #6bfe12 70%, rgba(107,254,18,0) 100%);

    border-radius: 4px;
    opacity: 0;
    transform: scaleX(0);

.boot-logo {
    position: relative;
    width: 640px;
    height: 320px;
    object-fit: contain;
    filter: drop-shadow(0 0 28px rgba(107, 254, 18, 0.45));

@keyframes bootLogo {

    10%  { opacity: 0; transform: scale(0.84); }
    28%  { opacity: 1; transform: scale(1); }
    72%  { opacity: 1; transform: scale(1.07); }
    100% { opacity: 0; transform: scale(4.5); }
}
@keyframes bootGlow {
    0%   { opacity: 0; transform: scale(0.4); }
    35%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.5); }
}
@keyframes bootFlare {
    0%   { opacity: 0; transform: scaleX(0); }
    25%  { opacity: 1; transform: scaleX(0.7); }
    100% { opacity: 0; transform: scaleX(1.25); }
}
@keyframes bootOut  { to { opacity: 0; visibility: hidden; } }
@keyframes bootSkip { to { opacity: 0; visibility: hidden; } }

    // Scale the 1920x1080 design to fit any screen, keeping its shape (black bars if needed)
    (function() {
        function fit() {
            var st = document.getElementById('stage');
            if (!st) return;
            var w = window.innerWidth || 1920, h = window.innerHeight || 1080;
            var s = Math.min(w / 1920, h / 1080);
            var x = Math.round((w - 1920 * s) / 2), y = Math.round((h - 1080 * s) / 2);
            st.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';

    <script>
    (function() {
        var BOOT_SOUND = true;          // set to false for a silent startup
        var screenEl = document.getElementById('boot-screen');
        var active = true;
        var started = Date.now();

        function end(skip) {
            if (!active) return;
            active = false;
            document.body.classList.remove('booting');
            if (screenEl) {
                if (skip) screenEl.classList.add('skip');
                setTimeout(function() {
                    if (screenEl.parentNode) screenEl.parentNode.removeChild(screenEl);
                }, skip ? 500 : 800);
            }
        }

        // Any button press skips the intro (after a short moment)
        window.addEventListener('keydown', function(e) {
            if (!active) return;
            e.preventDefault();
            e.stopImmediatePropagation();
            if (Date.now() - started > 700) end(true);
        }, true);
        if (screenEl) screenEl.addEventListener('click', function() { end(true); });

        // Soft synthesized "ta-dum" when the logo appears
        function sound() {
            try {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                var ctx = new AC();
                var master = ctx.createGain();
                master.gain.value = 0.22;
                master.connect(ctx.destination);
                var t0 = ctx.currentTime + 0.5;
                var tone = function(freq, start, dur, type, vol) {
                    var o = ctx.createOscillator();
                    var g = ctx.createGain();
                    o.type = type;
                    o.frequency.setValueAtTime(freq, t0 + start);
                    g.gain.setValueAtTime(0.0001, t0 + start);
                    g.gain.exponentialRampToValueAtTime(vol, t0 + start + 0.04);
                    g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
                    o.connect(g);
                    g.connect(master);
                    o.start(t0 + start);
                    o.stop(t0 + start + dur + 0.05);
                };
                tone(55, 0, 0.9, 'sine', 1.0);
                tone(110, 0, 0.8, 'triangle', 0.5);
                tone(82.4, 0.55, 1.8, 'sine', 1.0);
                tone(164.8, 0.55, 1.6, 'triangle', 0.45);
                tone(329.6, 0.6, 1.3, 'sine', 0.18);
                if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
                setTimeout(function() { try { ctx.close(); } catch (e) {} }, 4500);
            } catch (e) {}
        }
        if (BOOT_SOUND) sound();

        setTimeout(function() { end(false); }, 3000);
    })();
    </script>

        isClosing = false;
        isLiveStream = Boolean(o.isLive);
        onCloseCallback = o.onClose || null;
        currentTime = o.resumeMs || 0;
        duration = 0;
        isPlaying = false;
        endedHandled = false;
        lastProgressReport = Date.now();
        cancelScrub();
        hideUpNext();
        upNextDismissed = false;
        closeStrip(true);
        setIntro(false);
        resetSettingsForNewStream(o.url);

        document.body.classList.add('playing');
        document.documentElement.classList.add('playing');
        document.body.classList.toggle('avplay', !!getAVPlay());
        const pc = $('player-container');
        pc.style.display = 'block';
        pc.classList.toggle('live', isLiveStream);

        $('hud-kicker').textContent = o.kicker || '';
        $('hud-title').textContent = o.title || 'ARY Plus';
        $('hud-sub').textContent = o.subtitle || '';
        $('hud-status').textContent = '';

        buildButtons();
        defaultFocus();
        updateTimeDisplay();
        spinner(true);
        showHUD();

        console.log('[PlayerEngine] Playing:', o.url, 'Live:', isLiveStream);
        const avplay = getAVPlay();
        if (avplay) {
            playAVPlay(o.url, avplay, o.resumeMs);
        } else {
            playHTML5(o.url, o.resumeMs);
        }
        loadVariants(o.url, playToken);
    }

    function stopMedia() {
        const avplay = getAVPlay();
        if (avplay) {
            try {
                const state = avplay.getState();
                if (state === 'PLAYING' || state === 'PAUSED' || state === 'READY') avplay.stop();
            } catch (e) {}
            try { avplay.close(); } catch (e) {}
        }
        if (videoElement) {
            if (hlsInstance) {
                try { hlsInstance.destroy(); } catch (e) {}
                hlsInstance = null;
            }
            try { videoElement.pause(); } catch (e) {}
            videoElement.removeAttribute('src');
            try { videoElement.load(); } catch (e) {}
        }
        isPlaying = false;
    }

    function playAVPlay(url, avplay, resumeMs) {
        // Safe reset before opening new stream
        try {
            const state = avplay.getState();
            if (state !== 'NONE' && state !== 'IDLE') {
                try { avplay.stop(); } catch(e){}
                try { avplay.close(); } catch(e){}
            }
        } catch (e) {}

        try {
            avplay.open(url);
            avplay.setDisplayRect(0, 0, 1920, 1080);
            avplay.setDisplayMethod('PLAYER_DISPLAY_MODE_LETTER_BOX');

            try {
                avplay.setStreamingProperty("USER_AGENT", "Mozilla/5.0 (SMART-TV; Linux; Tizen 6.0) AppleWebKit/537.36");
            } catch (e) {}

            avplay.setListener({
                onbufferingstart: function() { spinner(true); },
                onbufferingcomplete: function() { spinner(false); },
                oncurrentplaytime: function(time) { onTime(time); },
                onerror: function(eventType) {
                    console.error('[AVPlay Error]', eventType);
                    $('hud-status').textContent = 'Stream error - press Back and try again';
                    spinner(false);
                    showHUD();
                },
                onstreamcompleted: function() {
                    console.log('[AVPlay] Stream Completed');
                    handleEnded();
                }
            });

            avplay.prepareAsync(function() {
                spinner(false);
                try { duration = avplay.getDuration(); } catch(e) { duration = 0; }
                const startPlayback = function() {
                    try {
                        avplay.play();
                        isPlaying = true;
                    } catch (e) {
                        console.error('[AVPlay play exception]', e);
                    }
                    if (playbackSpeed !== 1) applySpeed();
                    renderButtons();
                    showHUD();
                };
                if (resumeMs && resumeMs > 1000 && !isLiveStream) {
                    try { avplay.seekTo(resumeMs, startPlayback, startPlayback); }
                    catch (e) { startPlayback(); }
                } else {
                    startPlayback();
                }
            }, function(err) {
                console.error('[AVPlay Prepare Failed]', err);
                if (fallbackToAuto()) return;
                $('hud-status').textContent = 'Playback error - press Back and try again';
                spinner(false);
                showHUD();
            });

        } catch (e) {
            console.error('[AVPlay Exception]', e);
            spinner(false);
        }
    }

    function playHTML5(url, resumeMs) {
        if (!videoElement) return;

        const onMeta = function() {
            videoElement.removeEventListener('loadedmetadata', onMeta);
            if (resumeMs && resumeMs > 1000 && !isLiveStream) videoElement.currentTime = resumeMs / 1000;
            applySpeed();
        };
        videoElement.addEventListener('loadedmetadata', onMeta);

        if (hlsInstance) {
            try { hlsInstance.destroy(); } catch(e){}
            hlsInstance = null;
        }

        if (window.Hls && Hls.isSupported()) {
            hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(videoElement);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                videoElement.play().catch(e => console.log('Autoplay caught:', e));
                spinner(false);
                isPlaying = true;
            });
            hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    console.error('[HLS.js Fatal Error]', data);
                    spinner(false);
                }
            });
        } else {
            videoElement.src = url;
            videoElement.play().then(() => {
                spinner(false);
                isPlaying = true;
                renderButtons();
            }).catch(err => {
                console.warn('[HTML5 play error]', err);
                spinner(false);
                showHUD();
            });
        }

        videoElement.ontimeupdate = () => {
            if (!active) return;
            const d = (videoElement.duration || 0) * 1000;
            if (d && isFinite(d)) duration = d;
            onTime(videoElement.currentTime * 1000);
        };
    }

    // ---------- Time, progress, intro, up next ----------
    function onTime(ms) {
        if (!active) return;
        currentTime = ms;
        if (!duration) {
            const avplay = getAVPlay();
            if (avplay) { try { duration = avplay.getDuration(); } catch (e) {} }
        }
        updateTimeDisplay();
        maybeIntro();
        maybeUpNext();
        reportProgress(false);
    }

    function reportProgress(force) {
        if (isLiveStream || !opts.onProgress || !duration) return;
        const now = Date.now();
        if (!force && now - lastProgressReport < 5000) return;
        lastProgressReport = now;
        try { opts.onProgress(currentTime, duration); } catch (e) { console.warn(e); }
    }

    function formatTime(ms) {
        let t = Math.max(0, Math.floor((ms || 0) / 1000));
        const h = Math.floor(t / 3600);
        const m = Math.floor((t % 3600) / 60);
        const s = t % 60;
        const ss = (s < 10 ? '0' : '') + s;
        if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + ss;
        return m + ':' + ss;
    }

    function updateTimeDisplay() {
        if (isLiveStream) return;
        const d = duration;
        const shown = scrubbing ? scrubTarget : currentTime;
        const pct = function(v) { return d ? Math.min(100, Math.max(0, (v / d) * 100)) : 0; };
        const fill = $('hud-fill'), thumb = $('hud-thumb'), bubble = $('hud-bubble'), sf = $('hud-scrub-fill');
        if (fill) fill.style.width = pct(currentTime) + '%';
        if (thumb) thumb.style.left = pct(shown) + '%';
        if (bubble) {
            bubble.style.left = pct(shown) + '%';
            const diff = shown - currentTime;
            bubble.innerHTML = formatTime(shown) + '<small>' + (diff >= 0 ? '+' : '−') + formatTime(Math.abs(diff)) + '</small>';
        }
        if (sf) {
            const a = pct(Math.min(shown, currentTime)), b = pct(Math.max(shown, currentTime));
            sf.style.left = a + '%';
            sf.style.width = (b - a) + '%';
        }
        // Current time on the left, total length always on the right
        const total = d || (opts && opts.lengthMs) || 0;
        $('hud-cur').textContent = formatTime(shown);
        $('hud-remain').textContent = total ? formatTime(total) : '--:--';
    }

    function setIntro(on) {
        introVisible = on;
        const pill = $('skip-intro');
        if (pill) pill.classList.toggle('visible', on);
    }

    function maybeIntro() {
        const end = opts.introEndMs || 0;
        const show = !isLiveStream && end > 8000 && currentTime > 1500 && currentTime < end - 1500 && !scrubbing && !stripOpen;
        if (show !== introVisible) setIntro(show);
    }

    function skipIntro() {
        setIntro(false);
        seekTo(opts.introEndMs || 0);
    }

    function maybeUpNext() {
        if (isLiveStream || !opts.hasNext || !duration || duration < 120000 || upNextDismissed || scrubbing) return;
        const remain = duration - currentTime;
        if (remain <= 20000 && remain > 0) {
            if (!upNextVisible) showUpNext();
            $('upnext-count').textContent = 'Next episode in ' + Math.max(1, Math.ceil(remain / 1000));
        } else if (upNextVisible) {
            hideUpNext();
        }
    }

    function showUpNext() {
        const n = opts.nextInfo || {};
        upNextVisible = true;
        upNextChoice = 0;
        $('upnext-title').textContent = n.title || 'Next episode';
        $('upnext-sub').textContent = n.sub || '';
        const im = $('upnext-img');
        if (im) im.src = n.image || 'icon.png';
        $('upnext').classList.add('visible');
        hideHUD();
        renderUpNext();
    }

    function hideUpNext() {
        upNextVisible = false;
        const el = $('upnext');
        if (el) el.classList.remove('visible');
    }

    function dismissUpNext() {
        upNextDismissed = true;
        hideUpNext();
    }

    function renderUpNext() {
        $('upnext-play').classList.toggle('focused', upNextChoice === 0);
        $('upnext-cancel').classList.toggle('focused', upNextChoice === 1);
    }

    function handleEnded() {
        if (!active || endedHandled) return;
        endedHandled = true;
        if (duration) currentTime = duration;
        reportProgress(true);
        if (opts.hasNext && !upNextDismissed) goNext();
        else closePlayer();
    }

    function goNext() {
        if (!opts.hasNext || typeof opts.onNext !== 'function') { flashStatus(isLiveStream ? 'No more channels' : 'This is the latest episode'); showHUD(); return; }
        reportProgress(true);
        hideUpNext();
        opts.onNext();
    }

    function goPrev() {
        if (!opts.hasPrev || typeof opts.onPrev !== 'function') { flashStatus(isLiveStream ? 'No more channels' : 'This is the first episode'); showHUD(); return; }
        reportProgress(true);
        opts.onPrev();
    }

    // ---------- Play / pause / seek / scrub ----------
    function flashCenter(icon) {
        const c = $('hud-center');
        if (!c) return;
        c.innerHTML = ICONS[icon] || '';
        c.classList.remove('flash');
        void c.offsetWidth;
        c.classList.add('flash');
    }

    function togglePlayPause() {
        if (scrubbing) { commitScrub(); return; }
        const avplay = getAVPlay();
        if (!isPlaying) {
            if (avplay) { try { avplay.play(); } catch(e){} }
            else if (videoElement) { videoElement.play().catch(function() {}); }
            isPlaying = true;
        } else {
            if (avplay) { try { avplay.pause(); } catch(e){} }
            else if (videoElement) { videoElement.pause(); }
            isPlaying = false;
            reportProgress(true);
        }
        renderButtons();
        showHUD();
    }

    function seekTo(ms) {
        if (isLiveStream) return;
        const target = Math.max(0, Math.min(duration ? duration - 1000 : ms, ms));
        const avplay = getAVPlay();
        if (avplay) {
            try { avplay.seekTo(target); } catch(e){}
        } else if (videoElement) {
            videoElement.currentTime = target / 1000;
        }
        currentTime = target;
        endedHandled = false;
        updateTimeDisplay();
        maybeUpNext();
        showHUD();
    }

    function seek(offsetSeconds) {
        seekTo(currentTime + offsetSeconds * 1000);
    }

    // Left/Right moves a preview point; the video jumps there when you stop pressing (or press OK)
    function scrubStep(dir, big) {
        if (isLiveStream || !duration) { showHUD(); return; }
        const now = Date.now();
        if (!scrubbing) {
            scrubbing = true;
            scrubTarget = currentTime;
            scrubCount = 0;
        }
        if (now - scrubLastKey > 700) scrubCount = 0;  // a fresh press starts slow again
        scrubLastKey = now;
        scrubCount++;
        let step = big ? 30000 : (scrubCount < 4 ? 10000 : (scrubCount < 12 ? 30000 : 60000));
        scrubTarget = Math.max(0, Math.min(duration - 2000, scrubTarget + dir * step));
        hudFocus = 'bar';
        $('player-container').classList.add('scrubbing');
        setIntro(false);
        updateTimeDisplay();
        renderHudFocus();
        showHUD();
        clearTimeout(scrubTimer);
        scrubTimer = setTimeout(commitScrub, 1000);
    }

    function commitScrub() {
        if (!scrubbing) return;
        clearTimeout(scrubTimer);
        scrubbing = false;
        $('player-container').classList.remove('scrubbing');
        seekTo(scrubTarget);
    }

    function cancelScrub() {
        clearTimeout(scrubTimer);
        scrubbing = false;
        const pc = $('player-container');
        if (pc) pc.classList.remove('scrubbing');
        updateTimeDisplay();
    }

    // ---------- HUD + buttons ----------
    // Two groups: main controls in the middle of the screen, extras (episodes, settings) bottom-right
    // Center buttons (prev, -10, play, +10, next), the progress bar, and extras bottom-right
    let groups = { center: [], extras: [] };
    let groupIndex = { center: 0, extras: 0 };

    function defaultFocus() {
        hudFocus = 'center';
        groupIndex.center = Math.max(0, groups.center.findIndex(function(b) { return b.id === 'play'; }));
        groupIndex.extras = 0;
    }

    function buildButtons() {
        const c = [], x = [];
        c.push({ id: 'prev', icon: 'prev', tip: isLiveStream ? 'Previous channel' : 'Previous episode', disabled: !opts.hasPrev });
        if (!isLiveStream) c.push({ id: 'back10', icon: 'back10', tip: 'Back 10 sec' });
        c.push({ id: 'play', icon: 'play', tip: 'Play / Pause', big: true });
        if (!isLiveStream) c.push({ id: 'fwd10', icon: 'fwd10', tip: 'Forward 10 sec' });
        c.push({ id: 'next', icon: 'next', tip: isLiveStream ? 'Next channel' : 'Next episode', disabled: !opts.hasNext });
        if (opts.episodes && opts.episodes.length > 1) x.push({ id: 'episodes', icon: 'episodes', label: 'Episodes' });
        x.push({ id: 'settings', icon: 'settings', label: 'Quality & speed' });
        groups = { center: c, extras: x };
        [['center', 'hud-main'], ['extras', 'hud-extras']].forEach(function(g) {
            const wrap = $(g[1]);
            wrap.innerHTML = '';
            groups[g[0]].forEach(function(btn, i) {
                const el = document.createElement('div');
                el.className = 'pbtn' + (btn.big ? ' big' : '') + (btn.label ? ' pill' : '') + (btn.disabled ? ' disabled' : '');
                el.id = 'pbtn-' + btn.id;
                el.innerHTML = ICONS[btn.icon] + (btn.label ? '<span class="lbl">' + btn.label + '</span>' : '<span class="tip">' + btn.tip + '</span>');
                el.onclick = function() { if (btn.disabled) return; hudFocus = g[0]; groupIndex[g[0]] = i; activateButton(btn.id); };
                wrap.appendChild(el);
            });
        });
        renderButtons();
    }

    function renderButtons() {
        const p = $('pbtn-play');
        if (p) p.firstChild.outerHTML = isPlaying ? ICONS.pause : ICONS.play;
        renderHudFocus();
    }

    function renderHudFocus() {
        const bar = $('hud-bar');
        if (bar) bar.classList.toggle('focused', hudFocus === 'bar' && !isLiveStream);
        ['center', 'extras'].forEach(function(g) {
            groups[g].forEach(function(b, i) {
                const el = $('pbtn-' + b.id);
                if (el) el.classList.toggle('focused', hudFocus === g && i === groupIndex[g]);
            });
        });
    }

    function activateButton(id) {
        switch (id) {
            case 'prev': goPrev(); break;
            case 'next': goNext(); break;
            case 'back10': seek(-10); break;
            case 'fwd10': seek(10); break;
            case 'play': togglePlayPause(); break;
            case 'episodes': openStrip(); break;
            case 'settings': openSettings(); break;
        }
    }

    function showHUD() {
        const hud = $('player-hud');
        if (!hud) return;
        hud.classList.add('visible');
        renderHudFocus();
        clearTimeout(hudTimer);
        hudTimer = setTimeout(function() {
            if (isPlaying && !settingsOpen && !stripOpen && !scrubbing) hideHUD();
        }, 5000);
    }

    function hideHUD() {
        const hud = $('player-hud');
        if (hud) hud.classList.remove('visible');
        clearTimeout(hudTimer);
        defaultFocus();
    }

    function hudVisible() {
        const hud = $('player-hud');
        return hud && hud.classList.contains('visible');
    }

    // ---------- Episode strip inside the player ----------
    function openStrip() {
        if (!opts.episodes || !opts.episodes.length) return;
        stripOpen = true;
        stripIndex = opts.currentIndex || 0;
        setIntro(false);
        renderStrip();
        $('player-container').classList.add('strip-on');
        showHUD();
    }

    function closeStrip(silent) {
        stripOpen = false;
        const pc = $('player-container');
        if (pc) pc.classList.remove('strip-on');
        if (!silent) showHUD();
    }

    function renderStrip() {
        const track = $('strip-track');
        const list = opts.episodes || [];
        $('strip-count').textContent = list.length + ' episodes';
        if (track.childElementCount !== list.length || track.dataset.token !== String(playToken)) {
            track.innerHTML = '';
            track.dataset.token = String(playToken);
            list.forEach(function(e, i) {
                const c = document.createElement('div');
                c.className = 'card ep';
                c.innerHTML = '<div class="thumb"><img data-src="' + (e.image || '') + '" alt="" onload="this.classList.add(\'loaded\')" onerror="this.src=\'icon.png\'">' +
                    (i === opts.currentIndex ? '<span class="watching-tag">PLAYING</span>' : '') +
                    (e.progress ? '<div class="pbar"><i style="width:' + e.progress + '%"></i></div>' : '') +
                    '<span class="play-ico"></span></div><div class="cap"><div class="c1"></div><div class="c2"></div></div>';
                c.querySelector('.c1').textContent = e.label || '';
                c.querySelector('.c2').textContent = e.sub || '';
                c.onclick = function() { stripIndex = i; pickStrip(); };
                track.appendChild(c);
            });
        }
        Array.prototype.forEach.call(track.children, function(c, i) {
            c.classList.toggle('focused', i === stripIndex);
            if (Math.abs(i - stripIndex) <= 6) {
                const im = c.querySelector('img');
                if (im && !im.getAttribute('src')) im.src = im.dataset.src || 'icon.png';
            }
        });
        scrollTrack(track, stripIndex);
    }

    function pickStrip() {
        if (stripIndex === opts.currentIndex) { closeStrip(); return; }
        reportProgress(true);
        closeStrip(true);
        if (typeof opts.onPickEpisode === 'function') opts.onPickEpisode(stripIndex);
    }

    // Keeps the focused card at the left edge, without leaving empty space at the end
    function scrollTrack(track, idx) {
        const card = track.children[idx];
        if (!card) { track.style.transform = 'translateX(0px)'; return; }
        const last = track.children[track.children.length - 1];
        const visible = 1920 - 180;
        const maxX = Math.max(0, last.offsetLeft + last.offsetWidth - track.children[0].offsetLeft - visible);
        const x = Math.min(Math.max(0, card.offsetLeft - track.children[0].offsetLeft), maxX);
        track.style.transform = 'translateX(' + (-x) + 'px)';
    }

    // ---------- Remote keys while the player is open ----------
    function handleKey(k) {
        if (!active) return;
        if (settingsOpen) { handleSettingsKey(k); return; }

        // Media keys work everywhere in the player
        switch (k) {
            case 413: closePlayer(); return;                                     // Stop
            case 10252: togglePlayPause(); return;                               // Play/Pause
            case 415: if (!isPlaying) togglePlayPause(); else showHUD(); return; // Play
            case 19: if (isPlaying) togglePlayPause(); else showHUD(); return;   // Pause
            case 412: if (isLiveStream) return; scrubStep(-1, true); return;     // Rewind
            case 417: if (isLiveStream) return; scrubStep(1, true); return;      // Fast forward
            case 427: case 33: goNext(); return;                                 // CH+ / Page up
            case 428: case 34: goPrev(); return;                                 // CH- / Page down
        }

        if (stripOpen) {
            const n = (opts.episodes || []).length;
            if (k === 37 && stripIndex > 0) stripIndex--;
            else if (k === 39 && stripIndex < n - 1) stripIndex++;
            else if (k === 13) { pickStrip(); return; }
            else if (k === 38 || k === 10009 || k === 27) { closeStrip(); return; }
            renderStrip();
            showHUD();
            return;
        }

        if (upNextVisible) {
            if (k === 37 || k === 39) { upNextChoice = upNextChoice ? 0 : 1; renderUpNext(); return; }
            if (k === 13) { if (upNextChoice === 0) goNext(); else dismissUpNext(); return; }
            if (k === 10009 || k === 27) { dismissUpNext(); return; }
            dismissUpNext();
        }

        if (k === 10009 || k === 27) {
            if (scrubbing) { cancelScrub(); showHUD(); return; }
            closePlayer();
            return;
        }

        if (!hudVisible()) {
            // OK always plays / pauses (or skips the intro while that button is showing)
            if (k === 13) { if (introVisible) skipIntro(); else togglePlayPause(); return; }
            if ((k === 37 || k === 39) && !isLiveStream) { scrubStep(k === 39 ? 1 : -1); return; }
            defaultFocus();
            showHUD();
            return;
        }

        // Down: center buttons -> progress bar -> extras -> episode list.  Up goes back.
        const order = isLiveStream ? ['center', 'extras'] : ['center', 'bar', 'extras'];
        const pos = order.indexOf(hudFocus);
        if (k === 38 || k === 40) {
            if (scrubbing) commitScrub();
            const np = pos + (k === 40 ? 1 : -1);
            if (np >= 0 && np < order.length) hudFocus = order[np];
            else if (k === 40 && opts.episodes && opts.episodes.length > 1) { openStrip(); return; }
            else if (k === 38 && introVisible) { skipIntro(); return; }
        } else if (hudFocus === 'bar') {
            if (k === 37 || k === 39) { scrubStep(k === 39 ? 1 : -1); return; }
            if (k === 13) { togglePlayPause(); return; }
        } else {
            const list = groups[hudFocus] || [];
            if (k === 37 || k === 39) {
                let j = groupIndex[hudFocus] + (k === 39 ? 1 : -1);
                while (j >= 0 && j < list.length && list[j].disabled) j += (k === 39 ? 1 : -1);
                if (j >= 0 && j < list.length) groupIndex[hudFocus] = j;
            }
            else if (k === 13 && list[groupIndex[hudFocus]] && !list[groupIndex[hudFocus]].disabled) { activateButton(list[groupIndex[hudFocus]].id); return; }
        }
        renderHudFocus();
        showHUD();
    }

    function closePlayer() {
        if (isClosing || !active) return;
        isClosing = true;
        reportProgress(true);
        clearTimeout(hudTimer);
        cancelScrub();
        hideUpNext();
        closeStrip(true);
        setIntro(false);
        closeSettings(true);
        stopMedia();
        active = false;

        hideHUD();
        const pc = $('player-container');
        if (pc) pc.style.display = 'none';
        spinner(false);
        document.body.classList.remove('playing');
        document.documentElement.classList.remove('playing');

        const cb = onCloseCallback;
        onCloseCallback = null;
        if (typeof cb === 'function') {
            try { cb(currentTime, duration); } catch (err) { console.error('[onCloseCallback Error]', err); }
        }
        isClosing = false;
    }

    // ===================== SETTINGS: QUALITY + SPEED =====================
    function speedOptions() {
        return getAVPlay() ? SPEEDS_AVPLAY : SPEEDS_HTML5;
    }

    function speedLabel(s) {
        return s === 1 ? '1x  (Normal)' : s + 'x';
    }

    function qualityOptions() {
        const list = [{ label: 'Auto', url: baseUrl }];
        variants.forEach(function(v) { list.push(v); });
        return list;
    }

    function resetSettingsForNewStream(url) {
        playToken++;
        baseUrl = url;
        playbackSpeed = 1;
        speedIndex = Math.max(0, speedOptions().indexOf(1));
        variants = [];
        qualityIndex = 0;
        closeSettings(true);
        renderSettings();
        updateBadges();
    }

    function flashStatus(msg) {
        const st = document.getElementById('hud-status');
        if (!st) return;
        const original = '';
        st.textContent = msg;
        setTimeout(function() {
            if (st.textContent === msg) st.textContent = original;
        }, 3500);
    }

    function updateBadges() {
        const el = document.getElementById('hud-badges');
        if (!el) return;
        const q = qualityOptions()[qualityIndex];
        const parts = [q ? q.label : 'Auto'];
        if (!isLiveStream) parts.push(playbackSpeed + 'x');
        el.textContent = parts.join('  \u2022  ');
    }

    function applySpeed() {
        const avplay = getAVPlay();
        try {
            if (avplay) {
                avplay.setSpeed(playbackSpeed);
            } else if (videoElement) {
                videoElement.playbackRate = playbackSpeed;
            }
            return true;
        } catch (e) {
            console.warn('[Player] Speed change failed', e);
            return false;
        }
    }

    function chooseSpeed(idx) {
        const opts = speedOptions();
        if (isLiveStream || idx < 0 || idx >= opts.length) return;
        const previous = playbackSpeed;
        playbackSpeed = opts[idx];
        if (applySpeed()) {
            speedIndex = idx;
        } else {
            playbackSpeed = previous;
            applySpeed();
            flashStatus('This speed is not supported for this video');
        }
        updateBadges();
        renderSettings();
    }

    function isHlsUrl(url) {
        return /\.m3u8(\?|$)/i.test(url || '');
    }

    function resolveVariantUrl(uri, base) {
        let full = uri;
        try { full = new URL(uri, base).href; } catch (e) {}
        const q = base.indexOf('?');
        // keep the access token of the main playlist if the quality link has none
        if (full.indexOf('?') === -1 && q !== -1) full += base.substring(q);
        return full;
    }

    // Reads the stream's main playlist and lists the picture qualities it offers
    async function loadVariants(url, token) {
        if (!isHlsUrl(url)) return;
        try {
            const resp = await fetch(url);
            const text = await resp.text();
            if (token !== playToken) return;
            if (text.indexOf('#EXT-X-STREAM-INF') === -1) return;
            // Separate audio track: picking one picture quality could silence the video, so keep Auto only
            if (/#EXT-X-MEDIA:[^\n]*TYPE=AUDIO[^\n]*URI=/i.test(text)) return;

            const lines = text.split(/\r?\n/);
            const byKey = {};
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.indexOf('#EXT-X-STREAM-INF:') !== 0) continue;
                let uri = '';
                for (let j = i + 1; j < lines.length; j++) {
                    const next = lines[j].trim();
                    if (next && next.charAt(0) !== '#') { uri = next; break; }
                }
                if (!uri) continue;
                const res = /RESOLUTION=(\d+)x(\d+)/i.exec(line);
                const bw = /(?:^|[:,])BANDWIDTH=(\d+)/i.exec(line);
                const height = res ? parseInt(res[2], 10) : 0;
                const bandwidth = bw ? parseInt(bw[1], 10) : 0;
                const key = height || bandwidth;
                if (!key) continue;
                if (!byKey[key] || bandwidth > byKey[key].bandwidth) {
                    byKey[key] = { height: height, bandwidth: bandwidth, uri: uri };
                }
            }
            const found = Object.keys(byKey).map(function(k) { return byKey[k]; });
            if (found.length < 2) return;
            found.sort(function(a, b) {
                return (b.height - a.height) || (b.bandwidth - a.bandwidth);
            });
            variants = found.map(function(v) {
                return {
                    label: v.height ? (v.height + 'p') : (Math.round(v.bandwidth / 1000) + ' kbps'),
                    url: resolveVariantUrl(v.uri, url)
                };
            });
            renderSettings();
        } catch (e) {
            console.warn('[Player] Could not read quality list', e);
        }
    }

    // Restart the same video (another quality) and carry on from the same moment
    function restartStream(url) {
        const resumeMs = isLiveStream ? 0 : currentTime;
        const sp = document.getElementById('spinner');
        if (sp) sp.style.display = 'block';
        const avplay = getAVPlay();
        if (avplay) {
            try { avplay.stop(); } catch (e) {}
            try { avplay.close(); } catch (e) {}
            isPlaying = false;
            playAVPlay(url, avplay, resumeMs);
        } else {
            playHTML5(url, resumeMs);
        }
    }

    function fallbackToAuto() {
        if (qualityIndex === 0) return false;
        qualityIndex = 0;
        updateBadges();
        renderSettings();
        flashStatus('That quality is not available - back to Auto');
        restartStream(baseUrl);
        return true;
    }

    function chooseQuality(idx) {
        const list = qualityOptions();
        if (idx < 0 || idx >= list.length || idx === qualityIndex) return;
        qualityIndex = idx;
        updateBadges();
        renderSettings();
        restartStream(list[idx].url);
    }

    // ---------- Settings panel ----------
    function renderSettings() {
        const qCol = document.getElementById('settings-col-quality');
        const sCol = document.getElementById('settings-col-speed');
        if (!qCol || !sCol) return;

        function build(col, colIndex, title, labels, activeIdx, note) {
            col.innerHTML = '';
            const head = document.createElement('div');
            head.className = 'settings-head';
            head.textContent = title;
            col.appendChild(head);
            labels.forEach(function(label, i) {
                const row = document.createElement('div');
                row.className = 'settings-item' + (i === activeIdx ? ' active' : '') +
                    ((settingsOpen && settingsCol === colIndex && settingsRow === i) ? ' focused' : '');
                const check = document.createElement('span');
                check.className = 'set-check';
                check.textContent = i === activeIdx ? '\u2713' : '';
                const text = document.createElement('span');
                text.textContent = label;
                row.appendChild(check);
                row.appendChild(text);
                row.onclick = function() {
                    settingsCol = colIndex;
                    settingsRow = i;
                    applySettingsSelection();
                };
                col.appendChild(row);
            });
            if (note) {
                const n = document.createElement('div');
                n.className = 'settings-note';
                n.textContent = note;
                col.appendChild(n);
            }
        }

        const q = qualityOptions();
        build(qCol, 0, 'Quality', q.map(function(o) { return o.label; }), qualityIndex,
              q.length < 2 ? 'Only Auto is available for this video' : '');
        if (isLiveStream) {
            build(sCol, 1, 'Speed', [], -1, 'Speed is not available for live streams');
        } else {
            build(sCol, 1, 'Speed', speedOptions().map(speedLabel), speedIndex, '');
        }
    }

    function applySettingsSelection() {
        if (settingsCol === 0) chooseQuality(settingsRow);
        else chooseSpeed(settingsRow);
        showHUD();
    }

    function openSettings() {
        const panel = document.getElementById('settings-panel');
        if (!panel) return;
        settingsOpen = true;
        settingsCol = 0;
        settingsRow = qualityIndex;
        renderSettings();
        panel.classList.add('visible');
        showHUD();
    }

    function closeSettings(silent) {
        settingsOpen = false;
        const panel = document.getElementById('settings-panel');
        if (panel) panel.classList.remove('visible');
        if (!silent) showHUD();
    }

    function isSettingsOpen() {
        return settingsOpen;
    }

    function handleSettingsKey(keyCode) {
        const counts = [qualityOptions().length, isLiveStream ? 0 : speedOptions().length];
        switch (keyCode) {
            case 38: // UP
                settingsRow = Math.max(0, settingsRow - 1);
                break;
            case 40: // DOWN
                settingsRow = Math.min(Math.max(0, counts[settingsCol] - 1), settingsRow + 1);
                break;
            case 37: // LEFT -> Quality list
                if (settingsCol !== 0 && counts[0] > 0) {
                    settingsCol = 0;
                    settingsRow = qualityIndex;
                }
                break;
            case 39: // RIGHT -> Speed list
                if (settingsCol !== 1 && counts[1] > 0) {
                    settingsCol = 1;
                    settingsRow = speedIndex;
                }
                break;
            case 13: // OK
                applySettingsSelection();
                return;
            case 10009: // Back
            case 27:
                closeSettings();
                return;
            default:
                return;
        }
        renderSettings();
        showHUD();
    }

    function isActive() {
        return active;
    }

    return {
        init: init,
        playStream: playStream,
        handleKey: handleKey,
        closePlayer: closePlayer,
        isActive: isActive,
        scrollTrack: scrollTrack,
        formatTime: formatTime
    };
})();

/**
 * Watch history, kept on the TV (localStorage). Powers Continue Watching,
 * New Episodes, resume points and progress bars.
 */
const History = (function() {
    const KEY = 'aryplus.history.v1';
    let data = null;

    function load() {
        if (data) return data;
        try { data = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { data = null; }
        if (!data || typeof data !== 'object') data = {};
        data.series = data.series || {};
        data.eps = data.eps || {};
        return data;
    }

    function save() {
        try {
            const ids = Object.keys(data.eps);
            if (ids.length > 800) {
                ids.sort(function(a, b) { return data.eps[b].t - data.eps[a].t; })
                   .slice(800).forEach(function(id) { delete data.eps[id]; });
            }
            const sids = Object.keys(data.series);
            if (sids.length > 60) {
                sids.sort(function(a, b) { return data.series[b].t - data.series[a].t; })
                    .slice(60).forEach(function(id) { delete data.series[id]; });
            }
            localStorage.setItem(KEY, JSON.stringify(data));
        } catch (e) {}
    }

    function slim(s) {
        return {
            _id: s._id, title: s.title, imagePoster: s.imagePoster, imageCoverBig: s.imageCoverBig,
            imageCoverDesktop: s.imageCoverDesktop, logo: s.logo, genreId: s.genreId, seriesType: s.seriesType,
            episodeCount: s.episodeCount, ageRating: s.ageRating, seiresCDN: s.seiresCDN, trailer: s.trailer
        };
    }

    function record(series, ep, pos, dur) {
        if (!series || !series._id || !dur) return;
        load();
        const now = Date.now();
        const num = ep ? parseInt(ep.videoEpNumber, 10) : NaN;
        const id = ep ? ep._id : series._id;
        data.eps[id] = { p: Math.round(pos), d: Math.round(dur), t: now };
        const prev = data.series[series._id] || {};
        data.series[series._id] = {
            s: slim(series),
            kind: ep ? 'series' : 'film',
            ep: ep ? {
                _id: ep._id, title: ep.title, num: num, image: ep.imagePath || ep.imagePathV2 || '',
                desc: String(ep.description || '').slice(0, 260), len: ep.videoLength,
                intro: ep.introTimeStamp, src: ep.videoSource, added: ep.createdAd
            } : null,
            p: Math.round(pos), d: Math.round(dur), t: now,
            max: Math.max(prev.max || 0, isNaN(num) ? 0 : num)
        };
        save();
    }

    function epProgress(id) { load(); return data.eps[id] || null; }
    function get(id) { load(); return data.series[id] || null; }
    function list() {
        load();
        return Object.keys(data.series).map(function(k) { return data.series[k]; })
            .sort(function(a, b) { return b.t - a.t; });
    }

    return { record: record, epProgress: epProgress, get: get, list: list };
})();

/**
 * ARY Plus TV - single page, remote-first UI
 * Home: hero + rows (New Episodes, Continue Watching, Dramas, TV Shows, Telefilms, Live TV)
 * Series page: resume / latest buttons, episode ranges, episode row
 */
const App = (function() {
    const API_BASE = 'https://be.aryplus.tv';
    const API_KEY = 'ak_37515186786306625012043079404171';
    const IMAGE_BASE = 'https://images.aryplus.tv/';
    const USER_COUNTRY = 'PK';
    const PAGE_SIZE = 20;
    const RANGE_SIZE = 20;

    const CATEGORIES = [
        { key: 'dramas', title: 'Dramas', api: 'dramas', kind: 'series', label: 'Drama', snap: 'dramas' },
        { key: 'shows', title: 'TV Shows', api: 'tv shows', kind: 'series', label: 'TV Show', snap: 'shows' },
        { key: 'telefilms', title: 'Telefilms', api: 'Telefilms', kind: 'film', label: 'Telefilm', snap: 'telefilms' },
        { key: 'live', title: 'Live TV', api: 'live streaming', kind: 'live', label: 'Live TV', snap: 'streams' }
    ];

    let view = 'home';
    let rows = [];
    let rowIndex = 0;
    let userMoved = false;
    const catData = {};
    const allEpisodesCache = {};
    const latestCache = {};
    let detail = null;
    let heroTimer = null, heroLayer = 0, heroKey = '';
    let exitArmedUntil = 0;
    let toastTimer = null;
    let digitBuf = '', digitTimer = null;
    let homeDirty = false;

    function $(id) { return document.getElementById(id); }
    function spinner(on) { const sp = $('spinner'); if (sp) sp.style.display = on ? 'block' : 'none'; }
    function img(path) { return path ? (String(path).indexOf('http') === 0 ? path : IMAGE_BASE + path) : ''; }
    function epNum(ep) { const n = parseInt(ep && ep.videoEpNumber, 10); return isNaN(n) ? NaN : n; }
    function isDone(p, d) { return d > 0 && (p / d >= 0.92 || d - p < 45000); }
    function esc(t) {
        return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function genres(s) {
        const g = s && s.genreId;
        if (Array.isArray(g)) return g.filter(Boolean).slice(0, 3);
        return g ? [String(g)] : [];
    }
    function epLabel(ep) {
        const n = epNum(ep);
        return isNaN(n) ? (ep && ep.title) || 'Episode' : 'Episode ' + n;
    }
    function minutes(sec) {
        const s = parseInt(sec, 10);
        if (isNaN(s) || s <= 0) return '';
        return Math.max(1, Math.round(s / 60)) + ' min';
    }
    function leftText(p, d) { return Math.max(1, Math.round((d - p) / 60000)) + ' min left'; }
    function ago(iso) {
        const t = Date.parse(iso || '');
        if (isNaN(t)) return '';
        const days = Math.floor((Date.now() - t) / 86400000);
        if (days <= 0) return 'Added today';
        if (days === 1) return 'Added yesterday';
        if (days < 7) return 'Added ' + days + ' days ago';
        return 'Added ' + new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }
    function isFilm(s) { return s && (s.seriesType === 'singleVideo'); }

    async function api(path) {
        const resp = await fetch(API_BASE + path, { headers: { 'x-api-key': API_KEY } });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
    }

    function toast(msg, ms) {
        const t = $('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() { t.classList.remove('visible'); }, ms || 2200);
    }

    // ===================== INIT =====================
    function init() {
        try { PlayerEngine.init(); } catch (e) { console.error('[App] PlayerEngine init error:', e); }
        setupRemoteKeys();
        startClock();
        buildRows();
        renderHome();
        CATEGORIES.forEach(function(c) { loadCategory(c, 1); });
        refreshLatest();
        // Opened from a Smart Hub preview tile (cold start), or picked while already running
        if (typeof tizen !== 'undefined') listenPreviewStatus();
        const link = (typeof tizen !== 'undefined') ? readDeepLink() : null;
        if (link) setTimeout(function() { openDeepLink(link); }, 600);
        window.addEventListener('appcontrol', function() { openDeepLink(readDeepLink()); });
    }

    function startClock() {
        const tick = function() {
            const d = new Date();
            let h = d.getHours(), m = d.getMinutes();
            const ap = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            const el = $('clock');
            if (el) el.textContent = h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
        };
        tick();
        setInterval(tick, 15000);
    }

    // ===================== DATA =====================
    async function loadCategory(c, page) {
        const st = catData[c.key] || (catData[c.key] = { items: [], page: 0, totalPages: 1, total: 0 });
        if (st.loading) return;
        st.loading = true;
        try {
            const d = await api('/api/series/byCatID/status/pg/' + encodeURIComponent(c.api) + '/' + USER_COUNTRY + '?limit=' + PAGE_SIZE + '&page=' + page);
            const got = Array.isArray(d.series) ? d.series : [];
            const seen = {};
            const merged = (page === 1 ? [] : st.items).concat(got).filter(function(s) {
                if (!s || seen[s._id]) return false;
                seen[s._id] = true;
                return true;
            });
            st.items = merged;
            st.page = page;
            st.totalPages = (d.pagination && d.pagination.totalPages) || 1;
            st.total = (d.pagination && d.pagination.totalSeries) || merged.length;
        } catch (e) {
            console.error('[App] Failed to fetch category:', c.api, e);
            if (page === 1 && !st.items.length && typeof INITIAL_CATEGORIES !== 'undefined' && INITIAL_CATEGORIES[c.snap]) {
                st.items = INITIAL_CATEGORIES[c.snap].series || [];
                st.page = 1;
                st.totalPages = 1;
                st.total = st.items.length;
            }
        } finally {
            st.loading = false;
            st.loaded = true;
        }
        const r = rows.find(function(x) { return x.key === c.key; });
        if (!r) return;
        const before = r.loading ? 0 : r.items.length;
        r.items = st.items.map(function(s) { return { t: itemType(c, s), series: s }; });
        r.loading = false;
        r.total = st.total;
        if (before === 0) fillTrack(r);
        else appendCards(r, before);
        setRowCount(r);
        if (view === 'home') updateHomeFocus();
    }

    function itemType(c, s) {
        if (c.kind === 'live' || (s && s.isLive === true)) return 'live';
        if (c.kind === 'film' || isFilm(s)) return 'film';
        return 'series';
    }

    // Every episode of a series, Episode 1 first (server gives pages of 20)
    async function fetchAllEpisodes(seriesId) {
        if (allEpisodesCache[seriesId]) return allEpisodesCache[seriesId];
        const first = await api('/api/cdn/' + seriesId + '?page=1&limit=' + PAGE_SIZE);
        let list = (first && Array.isArray(first.episode)) ? first.episode.slice() : [];
        const total = (first && typeof first.totalEpisodes === 'number') ? first.totalEpisodes : list.length;
        const pages = (first && typeof first.totalPages === 'number') ? first.totalPages : (Math.ceil(total / PAGE_SIZE) || 1);
        if (pages > 1) {
            const jobs = [];
            for (let p = 2; p <= pages; p++) jobs.push(api('/api/cdn/' + seriesId + '?page=' + p + '&limit=' + PAGE_SIZE).catch(function() { return null; }));
            (await Promise.all(jobs)).forEach(function(d) { if (d && Array.isArray(d.episode)) list = list.concat(d.episode); });
        }
        const seen = {};
        list = list.filter(function(ep) {
            const key = ep && (ep._id || ep.videoSource || ep.title);
            if (!key) return true;
            if (seen[key]) return false;
            seen[key] = true;
            return true;
        });
        const nums = list.map(epNum);
        const allNumbered = list.length > 0 && nums.every(function(n) { return !isNaN(n); });
        const allSame = allNumbered && nums.every(function(n) { return n === nums[0]; });
        if (allNumbered && !allSame) list.sort(function(a, b) { return epNum(a) - epNum(b); });
        if (list.length) {
            allEpisodesCache[seriesId] = list;
            latestCache[seriesId] = { ep: list[list.length - 1], t: Date.now() };
        }
        return list;
    }

    // Newest episode of a series with two tiny requests (for the New Episodes row)
    async function fetchLatest(seriesId) {
        const c = latestCache[seriesId];
        if (c && Date.now() - c.t < 10 * 60 * 1000) return c.ep;
        const first = await api('/api/cdn/' + seriesId + '?page=1&limit=1');
        let ep = first && first.episode && first.episode[0];
        const tp = (first && first.totalPages) || 1;
        if (tp > 1) {
            const last = await api('/api/cdn/' + seriesId + '?page=' + tp + '&limit=1');
            const e2 = last && last.episode && last.episode[0];
            if (e2 && (!ep || (epNum(e2) || 0) >= (epNum(ep) || 0))) ep = e2;
        }
        latestCache[seriesId] = { ep: ep || null, t: Date.now() };
        return ep;
    }

    async function refreshLatest(onlyId) {
        const hist = History.list().filter(function(h) { return h.kind !== 'film' && (!onlyId || h.s._id === onlyId); }).slice(0, 15);
        if (!hist.length) return;
        await Promise.all(hist.map(function(h) { return fetchLatest(h.s._id).catch(function() { return null; }); }));
        if (view === 'home' && !PlayerEngine.isActive()) { buildRows(); renderHome(); }
        else homeDirty = true;
    }

    // ===================== HOME ROWS =====================
    function personalRows() {
        const newItems = [], contItems = [];
        History.list().forEach(function(h) {
            if (!h.s || !h.s._id) return;
            if (h.kind === 'film') {
                if (!isDone(h.p, h.d) && h.p > 10000) contItems.push({ t: 'film', series: h.s, h: h, resume: true });
                return;
            }
            const lc = latestCache[h.s._id];
            const latest = lc && lc.ep;
            const latestNum = latest ? epNum(latest) : NaN;
            let newShown = false;
            if (latest && !isNaN(latestNum) && latestNum > (h.max || 0)) {
                const lp = History.epProgress(latest._id);
                if (!lp || !isDone(lp.p, lp.d)) {
                    newItems.push({ t: 'ep', series: h.s, ep: latest, isNew: true, h: h });
                    newShown = true;
                }
            }
            if (!h.ep) return;
            if (!isDone(h.p, h.d)) {
                contItems.push({
                    t: 'ep', series: h.s, h: h, resume: true,
                    ep: { _id: h.ep._id, title: h.ep.title, videoEpNumber: String(h.ep.num), imagePath: h.ep.image,
                          description: h.ep.desc, videoLength: h.ep.len, introTimeStamp: h.ep.intro, videoSource: h.ep.src, createdAd: h.ep.added }
                });
            } else if (!isNaN(h.ep.num) && latest && latestNum > h.ep.num) {
                const nextNum = h.ep.num + 1;
                if (!(newShown && nextNum === latestNum)) contItems.push({ t: 'next', series: h.s, num: nextNum, h: h });
            }
        });
        newItems.sort(function(a, b) { return String(b.ep.createdAd || '').localeCompare(String(a.ep.createdAd || '')); });
        return { newItems: newItems, contItems: contItems };
    }

    function buildRows() {
        const prevKey = rows[rowIndex] && rows[rowIndex].key;
        const prevFocus = {};
        rows.forEach(function(r) { prevFocus[r.key] = r.focus; });
        const p = personalRows();
        const out = [];
        if (p.newItems.length) out.push({ key: 'new', title: 'New Episodes', type: 'ep', items: p.newItems });
        if (p.contItems.length) out.push({ key: 'continue', title: 'Continue Watching', type: 'ep', items: p.contItems });
        CATEGORIES.forEach(function(c) {
            const d = catData[c.key];
            out.push({
                key: c.key, title: c.title, type: 'poster', cat: c,
                items: d && d.loaded ? d.items.map(function(s) { return { t: itemType(c, s), series: s }; }) : [],
                loading: !(d && d.loaded), total: d ? d.total : 0
            });
